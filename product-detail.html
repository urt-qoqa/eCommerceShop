<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details - ByteHub</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/svg+xml" href="logo.svg">
    <style>
        .product-detail-page {
            padding: 60px 0;
            min-height: 70vh;
        }

        .product-detail-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 60px;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .product-detail-image {
            width: 100%;
            background: #f8f9fa;
            border-radius: 16px;
            padding: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .product-detail-image img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
        }

        .product-detail-info h1 {
            font-size: 36px;
            margin-bottom: 15px;
            color: #000;
        }

        .product-detail-rating {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .product-detail-price {
            font-size: 42px;
            font-weight: 700;
            color: #204647;
            margin: 20px 0;
        }

        .product-detail-description {
            font-size: 16px;
            color: #666;
            line-height: 1.8;
            margin-bottom: 30px;
        }

        .product-specs {
            background: #f8f9fa;
            padding: 30px;
            border-radius: 12px;
            margin: 30px 0;
        }

        .product-specs h3 {
            font-size: 20px;
            margin-bottom: 20px;
        }

        .spec-item {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #e0e0e0;
        }

        .spec-item:last-child {
            border-bottom: none;
        }

        .spec-label {
            font-weight: 600;
            color: #333;
        }

        .spec-value {
            color: #666;
        }

        .product-actions {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }

        .quantity-selector {
            display: flex;
            align-items: center;
            gap: 15px;
            margin: 20px 0;
        }

        .quantity-btn {
            width: 40px;
            height: 40px;
            border: 2px solid #ddd;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            font-size: 20px;
            font-weight: bold;
            transition: all 0.3s;
        }

        .quantity-btn:hover {
            background: #204647;
            color: white;
            border-color: #204647;
        }

        .quantity-value {
            font-size: 20px;
            font-weight: 600;
            min-width: 40px;
            text-align: center;
        }

        @media (max-width: 768px) {
            .product-detail-container {
                grid-template-columns: 1fr;
                gap: 30px;
            }

            .product-detail-info h1 {
                font-size: 28px;
            }

            .product-detail-price {
                font-size: 32px;
            }

            /* Mobile Menu */
            .mobile-menu-btn {
                display: none;
                background: none;
                border: none;
                font-size: 24px;
                cursor: pointer;
            }

            @media (max-width: 768px) {
                .mobile-menu-btn {
                    display: block;
                }

                .nav {
                    position: fixed;
                    top: 0;
                    right: -100%;
                    width: 70%;
                    height: 100vh;
                    background: white;
                    flex-direction: column;
                    padding: 80px 20px;
                    transition: right 0.3s ease;
                    box-shadow: -5px 0 15px rgba(0, 0, 0, 0.1);
                    z-index: 998;
                }

                .nav.active {
                    right: 0;
                }
            }
        }
    </style>
</head>

<body>
    <!-- Header -->
    <header class="header">
        <div class="container">
            <div class="header-content">
                <a href="index.html" class="logo">
                    <div class="logo-icon" id="logoIcon"></div>
                    <span class="logo-text">ByteHub</span>
                </a>


                <nav class="nav" id="mainNav">
                    <a href="index.html" class="nav-link">Home</a>
                    <a href="products.html" class="nav-link active">Products</a>
                    <div class="dropdown">
                        <a href="#" class="nav-link dropdown-toggle">
                            Categories
                            <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                                <path d="M4 6L8 10L12 6" stroke="currentColor" stroke-width="2"
                                    stroke-linecap="round" />
                            </svg>
                        </a>
                        <div class="dropdown-menu">
                            <a href="products.html?category=laptops" class="dropdown-item">Laptops</a>
                            <a href="products.html?category=phones" class="dropdown-item">Phones</a>
                            <a href="products.html?category=accessories" class="dropdown-item">Accessories</a>
                        </div>
                    </div>
                </nav>

                <div class="search-bar">
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                        <circle cx="9" cy="9" r="6" stroke="#999" stroke-width="2" />
                        <path d="M14 14L18 18" stroke="#999" stroke-width="2" stroke-linecap="round" />
                    </svg>
                    <input type="text" placeholder="Search products...">
                </div>

                <div class="header-actions">
                    <a href="login.html" class="icon-btn">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                            <circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="2" />
                            <path d="M4 20C4 16 8 14 12 14C16 14 20 16 20 20" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" />
                        </svg>
                    </a>
                    <button class="icon-btn" id="cartBtn" style="position: relative;">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                            <path d="M3 3H5L7 16H19L21 7H7" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round" />
                            <circle cx="9" cy="20" r="1" fill="currentColor" />
                            <circle cx="17" cy="20" r="1" fill="currentColor" />
                        </svg>
                        <span id="cartCount" class="cart-badge" style="display: none;">0</span>
                    </button>

                </div>
            </div>
        </div>
    </header>

    <!-- Cart Modal -->
    <div class="cart-modal-overlay" id="cartOverlay"></div>
    <div class="cart-modal" id="cartModal">
        <div class="cart-header">
            <h3>Shopping Cart</h3>
            <button class="cart-close" id="cartClose" aria-label="Close cart">&times;</button>
        </div>
        <div class="cart-content" id="cartContent">
            <!-- Cart items will be injected here -->
        </div>
        <div class="cart-footer">
            <div class="cart-summary">
                <span class="total-label">Subtotal:</span>
                <span id="cartTotal" class="total-amount">$0.00</span>
            </div>
            <button class="btn btn-primary" style="width: 100%;" onclick="window.location.href='backend/checkout.php'">
                Checkout
            </button>
        </div>
    </div>


    <!-- Product Detail -->
    <section class="product-detail-page">
        <div class="product-detail-container" id="productDetail">
            <p style="text-align: center; grid-column: 1/-1; padding: 40px;">Loading product...</p>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-col">
                    <div class="footer-logo">
                        <div class="footer-logo-icon"></div>
                        <span class="footer-logo-text">ByteHub</span>
                    </div>
                    <p class="footer-description">Your trusted destination for premium tech products.</p>
                </div>

                <div class="footer-col">
                    <h3 class="footer-heading">Quick Links</h3>
                    <ul class="footer-links">
                        <li><a href="products.html">All Products</a></li>
                        <li><a href="products.html?category=laptops">Laptops</a></li>
                        <li><a href="products.html?category=phones">Smartphones</a></li>
                    </ul>
                </div>
            </div>

            <div class="footer-bottom">
                <p>&copy; 2025 ByteHub. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script src="cart-handler.js"></script>
    <script src="product-detail.js"></script>
</body>


</html>
