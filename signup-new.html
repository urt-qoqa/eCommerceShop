<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - ByteHub</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/svg+xml" href="logo.svg">
</head>

<body>
    <!-- Header -->
    <header class="header">
        <div class="container">
            <div class="header-content">
                <a href="index.html" class="logo">
                    <div class="logo-icon" id="logoIcon"></div>
                    <span class="logo-text">ByteHub</span>
                </a>

                <nav class="nav">
                    <a href="index.html" class="nav-link">Home</a>
                    <a href="products.html" class="nav-link">Products</a>
                    <div class="dropdown">
                        <a href="#" class="nav-link dropdown-toggle">
                            Categories
                            <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                                <path d="M4 6L8 10L12 6" stroke="currentColor" stroke-width="2"
                                    stroke-linecap="round" />
                            </svg>
                        </a>
                        <div class="dropdown-menu">
                            <a href="products.html?category=laptops" class="dropdown-item">Laptops</a>
                            <a href="products.html?category=phones" class="dropdown-item">Phones</a>
                            <a href="products.html?category=accessories" class="dropdown-item">Accessories</a>
                        </div>
                    </div>
                </nav>

                <div class="search-bar">
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                        <circle cx="9" cy="9" r="6" stroke="#999" stroke-width="2" />
                        <path d="M14 14L18 18" stroke="#999" stroke-width="2" stroke-linecap="round" />
                    </svg>
                    <input type="text" placeholder="Search products...">
                </div>

                <div class="header-actions">
                    <a href="login.html" class="btn btn-primary"
                        style="padding: 10px 20px; border-radius: 8px; font-size: 14px; text-decoration: none; color: white;">
                        Sign In
                    </a>
                </div>
            </div>
        </div>
    </header>

    <!-- Signup Section -->
    <section class="login-page">
        <div class="container">
            <div class="login-container" style="max-width: 450px; margin: 60px auto;">
                <div class="login-header" style="text-align: center; margin-bottom: 30px;">
                    <h1>Create Account</h1>
                    <p>Join ByteHub and start shopping</p>
                </div>

                <div class="login-card"
                    style="background: white; padding: 30px; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.06);">
                    <form class="login-form" id="signupForm">
                        <div class="form-group" style="margin-bottom: 20px;">
                            <label for="fullname">Full Name</label>
                            <input type="text" id="fullname" placeholder="John Doe" required
                                style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px;">
                        </div>

                        <div class="form-group" style="margin-bottom: 20px;">
                            <label for="email">Email Address</label>
                            <input type="email" id="email" placeholder="you@example.com" required
                                style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px;">
                        </div>

                        <div class="form-group" style="margin-bottom: 20px;">
                            <label for="password">Password</label>
                            <div class="password-input" style="position: relative;">
                                <input type="password" id="password" placeholder="••••••••" required
                                    style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px;">
                            </div>
                        </div>

                        <div class="form-group" style="margin-bottom: 20px;">
                            <label for="confirm">Confirm Password</label>
                            <div class="password-input" style="position: relative;">
                                <input type="password" id="confirm" placeholder="••••••••" required
                                    style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px;">
                            </div>
                        </div>

                        <div class="form-options" style="margin-bottom: 25px;">
                            <label class="checkbox-label"
                                style="display: flex; align-items: flex-start; gap: 8px; cursor: pointer; font-size: 14px; color: #666;">
                                <input type="checkbox" required style="margin-top: 3px;">
                                <span>I agree to the <a href="#"
                                        style="color: #204647; text-decoration: none; font-weight: 600;">Terms</a> & <a
                                        href="#"
                                        style="color: #204647; text-decoration: none; font-weight: 600;">Privacy</a></span>
                            </label>
                        </div>

                        <button type="submit" class="btn btn-primary btn-block"
                            style="width: 100%; padding: 14px; border-radius: 8px;">Create Account</button>
                    </form>

                    <div class="divider" style="text-align: center; margin: 25px 0; position: relative;">
                        <span
                            style="background: white; padding: 0 15px; color: #999; position: relative; z-index: 1;">Or
                            sign up with</span>
                        <div
                            style="position: absolute; top: 50%; left: 0; width: 100%; height: 1px; background: #eee; z-index: 0;">
                        </div>
                    </div>

                    <div class="social-login">
                        <button class="social-btn"
                            style="width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px; padding: 12px; border: 1px solid #ddd; border-radius: 8px; background: white; cursor: pointer;">
                            <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                                <path
                                    d="M19.8 10.2c0-.7-.1-1.4-.2-2H10v3.8h5.5c-.2 1.2-1 2.2-2.1 2.9v2.5h3.4c2-1.8 3-4.5 3-7.2z"
                                    fill="#4285F4" />
                                <path
                                    d="M10 20c2.8 0 5.2-.9 6.9-2.5l-3.4-2.5c-.9.6-2.1 1-3.5 1-2.7 0-5-1.8-5.8-4.3H.7v2.6C2.4 17.8 6 20 10 20z"
                                    fill="#34A853" />
                                <path
                                    d="M4.2 12.2c-.2-.6-.3-1.2-.3-1.9s.1-1.3.3-1.9V5.8H.7C.3 6.9 0 8 0 10s.3 3.1.7 4.2l3.5-2z"
                                    fill="#FBBC05" />
                                <path
                                    d="M10 4c1.5 0 2.9.5 3.9 1.5l2.9-2.9C15.2.8 12.8 0 10 0 6 0 2.4 2.2.7 5.8l3.5 2.7C5 5.8 7.3 4 10 4z"
                                    fill="#EA4335" />
                            </svg>
                            <span>Google</span>
                        </button>
                    </div>
                </div>

                <p class="signup-link" style="text-align: center; margin-top: 25px; color: #666;">
                    Already have an account? <a href="login.html"
                        style="color: #204647; font-weight: 700; text-decoration: none;">Sign in here</a>
                </p>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer-bottom"
                style="text-align: center; padding: 30px 0; border-top: 1px solid #eee; margin-top: 60px;">
                <p>&copy; 2025 ByteHub. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script src="auth-script.js"></script>
</body>

</html>
